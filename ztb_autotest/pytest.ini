[pytest]
testpaths = testcases
pythonpath = .
addopts = -v -rs --tb=short --import-mode=importlib
markers =
    p0: 主流程冒烟，每次部署必跑
    p1: 核心规则
    p2: 边缘场景
    api: 接口用例
    ui: UI 用例
    integration: 系统交互点用例
    contract: 接口契约校验
    e2e: 全链路场景（联调环境）
    feature(name): 可选功能，项目配置 features 开启才执行
    module(name): 所属业务模块，配合 --module 按模块回归
    req(name): 来源需求（需求目录名），配合 --req 只跑某个需求的用例
    needs(dep, mode=None): 依赖的外部系统（如 eval、ntko），按 project.yaml 中 envs.<环境>.deps 决定运行或跳过
    needs_config(*keys): 必需的配置项（如 trade.fetch_ws_url），未配置时开跑前即停止并提示
