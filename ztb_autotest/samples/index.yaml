# ============================================================
# 样本库索引：所有测试用的报文、业务文件、第三方资料都登记在这里。
# AI 和人都先读本文件，再按需读取具体文件；二进制文件（加密投标文件等）不要读内容，看这里的说明即可。
#
# 字段：
#   id       唯一编号，用例里用它取文件：samples.file("bid_normal_01")
#   path     相对 samples/ 的路径；TODO 表示还没放进来
#   source   来源：「测试环境接口日志 2026-11-10 张三」「工具 V8.2 生成」「手写，待录制」
#   expect   预期结果（业务文件用）：success / reject / TODO；reject 时在 msg 写提示语
#   desc     一句话说明，写清楚这个样本的特点
# 新增样本：把文件放到对应目录，在这里加一行；python -m common.samples 可以检查有没有漏登记
# ============================================================

# ---------- 接口报文（samples/messages/<外部系统>/<接口>/<场景>.req.xml 或 .resp.xml）----------
# 报文按路径约定读取，这里登记的是说明和来源。req = 请求，resp = 返回。
messages:
  - {dep: eval, interface: 获取评标结果, direction: 我们调对方, scenario: normal,       parts: [resp], source: 手写，待录制, desc: 评标完成，3 个候选人}
  - {dep: eval, interface: 获取评标结果, direction: 我们调对方, scenario: not_finished, parts: [resp], source: 手写，待录制, desc: 评标尚未结束}
  - {dep: eval, interface: 获取评标结果, direction: 我们调对方, scenario: failed_bid,   parts: [resp], source: 手写，待录制, desc: 流标（有效投标人不足）}
  - {dep: eval, interface: 获取评标结果, direction: 我们调对方, scenario: rejected,     parts: [resp], source: 手写，待录制, desc: 结果被退回，重新评标}
  - {dep: eval, interface: 获取评标结果, direction: 我们调对方, scenario: error,        parts: [resp], source: 手写，待录制, desc: 对方系统异常}
  - {dep: eval, interface: 评标取数_项目信息, direction: 对方调我们, scenario: normal, parts: [req], source: 手写，待录制, desc: 评标取项目和标段信息的请求}
  - {dep: eval, interface: 评标取数_投标人,   direction: 对方调我们, scenario: normal, parts: [req], source: 手写，待录制, desc: 评标取投标人名单的请求}
  - {dep: eval, interface: 评标取数_开标记录, direction: 对方调我们, scenario: normal, parts: [req], source: 手写，待录制, desc: 评标取开标记录的请求}
  - {dep: eval, interface: 评标主动推送,     direction: 对方调我们, scenario: normal, parts: [req], source: 手写，待录制, desc: 评标结束后推送结果（可选功能）}

# ---------- 业务文件（samples/files/<类别>/...）----------
