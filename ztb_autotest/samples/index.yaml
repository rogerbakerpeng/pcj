files:
  # 招标文件
  - {id: tender_01,       category: tender, path: files/tender/TODO.zbj,            source: TODO, desc: 一个标段的招标文件}
  # 投标文件：正常和各种异常
  - {id: bid_normal_01,   category: bid, path: files/bid/normal/TODO_1.tbj,          expect: success, source: TODO, desc: 正常投标文件（投标人 1）}
  - {id: bid_normal_02,   category: bid, path: files/bid/normal/TODO_2.tbj,          expect: success, source: TODO, desc: 正常投标文件（投标人 2）}
  - {id: bid_normal_03,   category: bid, path: files/bid/normal/TODO_3.tbj,          expect: success, source: TODO, desc: 正常投标文件（投标人 3）}
  - {id: bid_unsigned,    category: bid, path: files/bid/unsigned/TODO.tbj,          expect: reject, msg: 未签章,         source: TODO, desc: 未签章}
  - {id: bid_expired,     category: bid, path: files/bid/expired_cert/TODO.tbj,      expect: reject, msg: 证书已过期,     source: TODO, desc: 证书过期}
  - {id: bid_wrong_unit,  category: bid, path: files/bid/wrong_unit_cert/TODO.tbj,   expect: reject, msg: 签章单位不一致, source: TODO, desc: 用了其他单位的证书}
  - {id: bid_tampered,    category: bid, path: files/bid/tampered/TODO.tbj,          expect: reject, msg: 文件校验失败,   source: TODO, desc: 生成后被篡改}
  - {id: bid_broken,      category: bid, path: files/bid/broken/TODO.tbj,            expect: reject, msg: 文件格式错误,   source: TODO, desc: 损坏的文件}
  - {id: bid_old_version, category: bid, path: files/bid/old_version/TODO.tbj,       expect: TODO, source: TODO, desc: 旧版工具生成，兼容策略待确认}
